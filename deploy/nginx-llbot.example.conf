# Optional dedicated loopback listener. NOT installed automatically.
# Review bindings/authentication and your existing sites before public deployment.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    location = /llbot { return 302 /llbot/; }
    location /llbot/ {
        proxy_pass http://127.0.0.1:3080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript;
        sub_filter_once off;
        sub_filter '"/assets/' '"/llbot/assets/';
        sub_filter "'/assets/" "'/llbot/assets/";
        sub_filter 'if(String(r.port)!==t||n!==e){' 'if(!window.location.pathname.startsWith(`/llbot/`)&&(String(r.port)!==t||n!==e)){';
        sub_filter 'index-CLNKNFk_.js' 'index-CLNKNFk_.js?proxy-origin=20261102';
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
